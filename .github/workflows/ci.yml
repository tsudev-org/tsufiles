# Build, test and style check on every push and pull request.
name: CI

# Changes to documentation and repository metadata only skip the build and tests (see the changes job).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the run it replaces, on pull requests and on main. Main cancels too because runners queue: when
# several PRs are merged in a row, the older main runs would keep them busy for hours. Only the
# last commit on main runs to the end, and since it contains all the commits before it, nothing goes untested. A
# docs-only push can't hide a code push it cancelled: the changes job compares a push to main with the last main run
# whose build passed, so the cancelled code is still in the file list and gets built.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what the change needs. The workflow always runs, so the required build check always reports: a job
  # skipped by its condition counts as passed for the branch rules.
  # - code: anything besides documentation and repository metadata. When the file list can't be read, everything runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.sha }}
        run: |
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || everything "File list unreadable"
          else
            # A push to main can cancel the run of an earlier push. So compare with the last main run whose build
            # passed, not only with the previous commit: a docs-only push then still builds the code that was cancelled.
            base=""
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=30" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | "\(.id) \(.head_sha)"') || everything "Run list unreadable"
            while read -r id sha; do
              [ -z "$id" ] && continue
              built=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length') || built=0
              if [ "$built" != 0 ]; then base=$sha; break; fi
            done <<< "$runs"
            if [ -z "$base" ]; then everything "No earlier main run that built"; fi
            # The compare API lists at most 300 files.
            files=$(gh api "repos/$REPO/compare/$base...$AFTER" \
              --jq 'if (.files | length) >= 300 then "(too many)" else .files[].filename end') || everything "File list unreadable"
          fi
          if [ "$files" = "(too many)" ]; then everything "Too many files to list"; fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # TsuFiles: trang files.tsudev.com có workflow riêng (website.yml), không cần build .NET.
              website/*|.github/workflows/website.yml)
                continue ;;
              *.md|docs/*|LICENSE|.mailmap|.github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|.github/labeler.yml|.github/FUNDING.yml|.github/release.yml|.github/PULL_REQUEST_TEMPLATE*|.github/workflows/label-issue.yml|.github/workflows/label-pr.yml)
                continue ;;
            esac
            if [ "$code" = false ]; then echo "Needs the build: $f"; fi
            code=true
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"

  portable:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/portable.yml

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Restore
        # TsuFiles: lock file NuGet (Directory.Build.props); lệch thì chạy tools/cap-nhat-lock-nuget.sh.
        run: dotnet restore TsuFiles.slnx --locked-mode

      - name: Check formatting
        run: dotnet format TsuFiles.slnx --verify-no-changes --no-restore --severity warn

      # The release embeds the Noto fonts, so the tests run with them here too: the headless UI tests load them.
      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Build
        run: dotnet build TsuFiles.slnx --no-restore -c Release

      # Windows 11 Explorer menu (native DLL + unsigned sparse package); its tests load the DLL in-process.
      # The toolchain (~100 MB) is saved right after it is downloaded, even if a later step fails, so it is
      # downloaded once and not on every run. Release builds restore the same cache.
      - name: Restore Zig toolchain
        id: zig
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      - name: Build Explorer menu extension
        timeout-minutes: 30
        shell: pwsh
        run: ./build/build-explorer-menu.ps1

      - name: Save Zig toolchain
        if: steps.zig.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      # rhwp, 7-Zip and ExifTool are small; with them the HWP/HWPX, archive and metadata engine tests run too
      # (LibreOffice is skipped to save time).
      - name: Fetch rhwp, 7-Zip and ExifTool for engine tests
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,7zip,exiftool

      # The UI tests on their own first, as the release runs them (there they crashed with 0xC0000005): a crash
      # names the test that was running and leaves a dump in TestResults.
      - name: Test UI on its own
        run: dotnet test tests/TsuFiles.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      # TSUFILES_TEST_EXIFTOOL: the metadata tests write real files, and fail rather than skip if it isn't there.
      - name: Test
        env:
          TSUFILES_TEST_EXIFTOOL: ${{ github.workspace }}\engines\exiftool\exiftool.exe
        run: dotnet test TsuFiles.slnx --no-build -c Release --filter "FullyQualifiedName!~TsuFiles.App.Tests" --logger "trx" --results-directory TestResults

      # Builds Setup (src/TsuFiles.Setup) around a stub app and runs it in a sandbox: install, update and uninstall into a
      # scratch folder with a registry file of its own, without administrator rights.
      - name: Check the installer
        shell: pwsh
        run: ./build/build-installer.ps1 -CheckOnly

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screenshots
          path: |
            tests/TsuFiles.App.Tests/bin/Release/net10.0/screenshots/
            tests/TsuFiles.Setup.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  # The metadata writer on Linux, with the Perl ExifTool pinned in engines.json (the build above is its Windows side).
  metadata-linux:
    name: metadata (linux-x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: FFmpeg for the video test
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fetch ExifTool
        run: |
          set -euo pipefail
          read -r url sha256 < <(jq -r '.platforms."linux-x64".components.exiftool | "\(.url) \(.sha256)"' src/TsuFiles.Engines/Infrastructure/engines.json)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/exiftool.tar.gz" "$url"
          echo "$sha256  $RUNNER_TEMP/exiftool.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/exiftool"
          tar -xzf "$RUNNER_TEMP/exiftool.tar.gz" -C "$RUNNER_TEMP/exiftool" --strip-components=1
          echo "TSUFILES_TEST_EXIFTOOL=$RUNNER_TEMP/exiftool/exiftool" >> "$GITHUB_ENV"
          # On the PATH too: the conversion test goes through TsuFiles's own search and the Perl check.
          echo "$RUNNER_TEMP/exiftool" >> "$GITHUB_PATH"

      - name: Test
        run: dotnet test tests/TsuFiles.Engines.Tests -c Release --filter "FullyQualifiedName~MetadataTests"

  # Windows on ARM64 (#236), built and tested natively: the Explorer menu DLL, Setup, 7-Zip and rhwp are ARM64
  # builds. rhwp comes from a pinned build of .github/workflows/windows-arm64-native.yml (build/fetch-engines.ps1).
  # Until it is pinned, its tests skip and no package is built; once it is, the job also builds the win-arm64 Setup and
  # portable zip to try out.
  build-arm64:
    name: build (win-arm64)
    needs: changes
    # TsuFiles: runner ARM chỉ miễn phí cho repo công khai; bỏ qua khi repo còn riêng tư.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && !github.event.repository.private }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: ARM64 pins
        id: pins
        run: |
          $missing = @(./build/fetch-engines.ps1 -Runtime win-arm64 -MissingPins)
          if ($missing) {
            Write-Host "::warning::Not pinned yet for win-arm64: $($missing -join ', '). Their tests skip and no package is built (build/fetch-engines.ps1)."
          }
          "ready=$(([string](-not $missing)).ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore
        # TsuFiles: lock file NuGet (Directory.Build.props); lệch thì chạy tools/cap-nhat-lock-nuget.sh.
        run: dotnet restore TsuFiles.slnx --locked-mode

      - name: Fonts
        run: ./build/fetch-fonts.ps1

      # The pinned rhwp build when there is one, as for the package.
      - name: Fetch engines for engine tests
        run: |
          $only = @('7zip')
          if ('${{ steps.pins.outputs.ready }}' -eq 'true') { $only += @('rhwp') }
          ./build/fetch-engines.ps1 -Runtime win-arm64 -Only $only

      - name: Build
        run: |
          dotnet build TsuFiles.slnx --no-restore -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The x64 Zig toolchain the build job saves; it cross-compiles the ARM64 DLL under x64 emulation.
      - name: Restore Zig toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      - name: Build Explorer menu extension
        timeout-minutes: 30
        run: ./build/build-explorer-menu.ps1 -Architecture arm64

      - name: Test UI on its own
        run: dotnet test tests/TsuFiles.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        run: dotnet test TsuFiles.slnx --no-build -c Release --filter "FullyQualifiedName!~TsuFiles.App.Tests" --logger "trx" --results-directory TestResults

      - name: Check the installer
        run: ./build/build-installer.ps1 -CheckOnly -Runtime win-arm64

      - name: Build package
        if: steps.pins.outputs.ready == 'true'
        run: ./build/build-installer.ps1 -Runtime win-arm64 -Portable

      - name: Upload package
        if: steps.pins.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-arm64-package
          path: Releases/*-win-arm64-*
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows-arm64
          path: TestResults/
          if-no-files-found: ignore
